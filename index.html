<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f7f5" />
  <meta name="color-scheme" content="light" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="HEARTLINE" />
  <title>HEARTLINE Editor v3.0.1</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="heartline-v301-app.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button id="brandButton" class="brand" type="button" aria-label="Открыть библиотеку">
        <span class="brand-mark">H</span>
        <span><strong>HEARTLINE</strong><small>Frame &amp; Visual Editor</small></span>
      </button>
      <nav id="mainNav" class="main-nav" aria-label="Разделы приложения">
        <button data-route="library" class="nav-button active">Библиотека</button>
        <button data-route="reader" class="nav-button">Читать</button>
        <button data-route="storyboard" class="nav-button">Сториборд</button>
        <button data-route="assets" class="nav-button">Изображения</button>
        <button data-route="preview" class="nav-button">Превью</button>
        <button data-route="reviews" class="nav-button">Замечания</button>
        <button data-route="versions" class="nav-button">Версии</button>
        <button data-route="gpt" class="nav-button">GPT</button>
        <button data-route="graph" class="nav-button">Граф</button>
        <button data-route="export" class="nav-button">Экспорт</button>
      </nav>
      <div class="topbar-actions">
        <button id="undoButton" class="icon-button" type="button" title="Отменить" aria-label="Отменить">↶</button>
        <button id="redoButton" class="icon-button" type="button" title="Повторить" aria-label="Повторить">↷</button>
        <button id="installButton" class="button secondary hidden" type="button">Установить</button>
      </div>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <input id="novelInput" type="file" accept=".docx,.json,.zip" multiple hidden />
  <input id="assetInput" type="file" accept="image/*,.zip" multiple hidden />
  <input id="frameAssetInput" type="file" accept="image/*" hidden />
  <input id="gptInput" type="file" accept=".json,.zip" hidden />
  <input id="projectImportInput" type="file" accept=".zip,.json" hidden />

  <dialog id="modal" class="modal">
    <div class="modal-card">
      <header class="modal-header">
        <div><span id="modalKicker" class="kicker"></span><h2 id="modalTitle"></h2></div>
        <button id="modalClose" class="icon-button" type="button" aria-label="Закрыть">×</button>
      </header>
      <div id="modalBody" class="modal-body"></div>
      <footer id="modalFooter" class="modal-footer"></footer>
    </div>
  </dialog>

  <div id="toast" class="toast hidden" role="status"></div>

  <script>window.HEARTLINE_BUILD='3.0.1-flat';</script>
  <script src="heartline-v301-parser.js"></script>
  <script src="heartline-v301-exporter.js"></script>
  <script type="module" src="heartline-v301-app.js"></script>
</body>
</html>
