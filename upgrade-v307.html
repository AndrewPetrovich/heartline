<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HEARTLINE v3.0.7 update</title><style>body{font-family:Inter,system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;background:#f7f7f5;color:#20201e}.card{max-width:520px;padding:28px;border:1px solid #ddd;background:#fff;border-radius:16px;text-align:center}small{color:#777}</style></head><body><div class="card"><h2>HEARTLINE v3.0.7</h2><p id="status">Обновляю локальный кэш…</p><small>IndexedDB и редакторские данные не удаляются.</small></div><script>(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)));}document.getElementById('status').textContent='Готово. Открываю редактор…';setTimeout(()=>location.replace('./?v=307'),350);}catch(e){document.getElementById('status').textContent='Кэш обновлён частично. Откройте главную страницу вручную.';}})();</script></body></html>
