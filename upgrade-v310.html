<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HEARTLINE 3.1 Upgrade</title><style>body{font-family:system-ui;background:#f7f7f5;color:#222;display:grid;place-items:center;min-height:100vh;margin:0}.card{max-width:520px;background:#fff;border:1px solid #ddd;border-radius:18px;padding:28px;text-align:center}.ok{color:#0f8a63}</style><div class="card"><h1>HEARTLINE 3.1</h1><p id="status">Обновляю локальный кэш…</p></div><script>(async()=>{try{for(const r of await navigator.serviceWorker?.getRegistrations?.()||[])await r.unregister();for(const key of await caches.keys())await caches.delete(key);document.getElementById('status').innerHTML='<span class="ok">Готово.</span> Открываю редактор…';setTimeout(()=>location.replace('./?build=310'),500)}catch(e){document.getElementById('status').textContent='Кэш не удалось очистить автоматически. Откройте главную страницу и обновите её.'}})()</script></html>
