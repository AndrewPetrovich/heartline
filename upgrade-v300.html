<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <title>Обновление HEARTLINE v3</title>
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f7f5;color:#1f1f1d;font:15px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{max-width:560px;margin:20px;padding:28px;border:1px solid #dedfdb;border-radius:16px;background:white;text-align:center}.spinner{width:30px;height:30px;margin:0 auto 18px;border:3px solid #ddd;border-top-color:#171717;border-radius:50%;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}small{color:#6f716d}</style>
</head>
<body><main class="card"><div class="spinner"></div><h1>Обновление HEARTLINE v3</h1><p id="status">Удаляю только старый кэш приложения…</p><small>Версии, прогресс, замечания и изображения в IndexedDB сохраняются.</small></main>
<script>
(async()=>{
  const status=document.getElementById('status');
  try{
    if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));}
    if('caches' in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)));}
    status.textContent='Кэш очищен. Запускаю миграцию и HEARTLINE v3…';
    setTimeout(()=>location.replace('./?build=v300'),900);
  }catch(error){status.textContent='Не удалось очистить кэш автоматически. Откройте главную страницу с жёстким обновлением: '+error.message;}
})();
</script></body></html>
