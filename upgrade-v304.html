<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HEARTLINE v3.0.4 upgrade</title></head>
<body style="font-family:Inter,Arial,sans-serif;padding:32px;background:#f7f7f5;color:#1f1f1d">
<h1>HEARTLINE v3.0.4</h1><p id="status">Обновляю кэш приложения…</p>
<script>
(async()=>{
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
    document.getElementById('status').textContent='Готово. Открываю новую версию…';
  }catch(e){
    document.getElementById('status').textContent='Кэш обновлён частично: '+e.message;
  }
  setTimeout(()=>location.replace('./?v=304'),500);
})();
</script></body></html>
