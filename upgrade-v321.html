<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HEARTLINE 3.2.1</title>
<style>
body{font:15px system-ui,sans-serif;background:#f7f7f5;color:#222;display:grid;place-items:center;min-height:100vh;margin:0}
main{max-width:560px;padding:30px;text-align:center}
</style>
</head>
<body>
<main>
  <h1>HEARTLINE 3.2.1</h1>
  <p id="status">Обновляю Graph 2.0…</p>
</main>
<script>
(async()=>{
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(reg=>reg.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(key=>caches.delete(key)));
    }
    document.getElementById('status').textContent='Готово. Открываю HEARTLINE…';
    setTimeout(()=>location.replace('./?v=321'),350);
  }catch(error){
    document.getElementById('status').textContent='Обновите страницу вручную: '+error.message;
  }
})();
</script>
</body>
</html>
