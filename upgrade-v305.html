<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HEARTLINE v3.0.5 update</title><style>body{font-family:system-ui,sans-serif;background:#f7f7f5;color:#1f1f1d;display:grid;place-items:center;min-height:100vh;margin:0}.card{background:#fff;border:1px solid #dedfdb;border-radius:16px;padding:28px;max-width:560px;text-align:center}small{color:#6f716d}</style></head><body><div class="card"><h1>Обновление HEARTLINE v3.0.5</h1><p>Обновляем интерфейс Reader и очищаем только старый кэш приложения.</p><small>IndexedDB с новеллами, замечаниями, изображениями и прогрессом не удаляется.</small></div><script>(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)))}setTimeout(()=>location.replace('./?v=305'),500)}catch(e){document.querySelector('p').textContent='Ошибка очистки кэша: '+e.message}})();</script></body></html>
