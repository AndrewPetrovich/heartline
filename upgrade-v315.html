<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HEARTLINE 3.1.5</title><style>body{font:15px system-ui,sans-serif;background:#f7f7f5;color:#222;display:grid;place-items:center;min-height:100vh;margin:0}main{max-width:520px;padding:28px;text-align:center}</style></head><body><main><h1>HEARTLINE 3.1.5</h1><p id="status">Обновляю карту связей…</p></main><script>(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)))}document.getElementById('status').textContent='Готово. Открываю HEARTLINE…';setTimeout(()=>location.replace('./?v=315'),350)}catch(e){document.getElementById('status').textContent='Обновите страницу вручную: '+e.message}})();</script></body></html>
