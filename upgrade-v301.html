<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HEARTLINE v3.0.1</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f7f5;color:#1f1f1d;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{max-width:560px;margin:20px;padding:28px;border:1px solid #dedfdb;border-radius:16px;background:#fff;text-align:center}small{color:#6f716d}</style></head><body><main class="card"><h1>HEARTLINE v3.0.1</h1><p id="status">Очищаю только старый кэш приложения…</p><small>IndexedDB с версиями, прогрессом и замечаниями сохраняется.</small></main><script>(async()=>{const s=document.getElementById('status');try{if('serviceWorker'in navigator){const r=await navigator.serviceWorker.getRegistrations();await Promise.all(r.map(x=>x.unregister()));}if('caches'in window){const k=await caches.keys();await Promise.all(k.map(x=>caches.delete(x)));}s.textContent='Готово. Открываю HEARTLINE…';setTimeout(()=>location.replace('./?build=v301-flat'),700);}catch(e){s.textContent='Не удалось автоматически очистить кэш: '+e.message;}})();</script></body></html>
