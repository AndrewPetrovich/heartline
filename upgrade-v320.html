<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HEARTLINE 3.2</title><style>body{font:15px system-ui,sans-serif;background:#f7f7f5;color:#222;display:grid;place-items:center;min-height:100vh;margin:0}main{max-width:560px;padding:28px;text-align:center}</style></head><body><main><h1>HEARTLINE 3.2</h1><p id="status">Обновляю Graph 2.0 и навигацию…</p></main><script>(async()=>{try{if('serviceWorker'in navigator){const r=await navigator.serviceWorker.getRegistrations();await Promise.all(r.map(x=>x.unregister()))}if('caches'in window){const k=await caches.keys();await Promise.all(k.map(x=>caches.delete(x)))}document.getElementById('status').textContent='Готово. Открываю HEARTLINE…';setTimeout(()=>location.replace('./?v=320'),350)}catch(e){document.getElementById('status').textContent='Обновите страницу вручную: '+e.message}})();</script></body></html>
